<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafLens — Offline</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1.5rem;
      background-color: #06150e;
      color: #f4faee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      color: #88c973;
    }
    p {
      color: #9cbca7;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 320px;
      margin: 0 0 1.5rem;
    }
    button {
      background: #88c973;
      color: #06150e;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 9999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🪴</div>
  <h1>You're Offline</h1>
  <p>LeafLens needs an internet connection to run live weather checks and vision scans.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
